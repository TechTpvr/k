name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    env:
      HAS_RELEASE_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
             packages: ''

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare bundled Persian font
        run: node scripts/prepare-fonts.cjs

      - name: Build web app
        run: npm run build

      - name: Verify web build
        run: |
          test -f dist/index.html
          echo "Web build OK"

      - name: Add Capacitor Android
        run: npx cap add android

      - name: Apply KifNet app icon
        run: |
          set -e
          for size_dir in mipmap-mdpi:48 mipmap-hdpi:72 mipmap-xhdpi:96 mipmap-xxhdpi:144 mipmap-xxxhdpi:192; do
            dir="${size_dir%%:*}"
            size="${size_dir##*:}"
            mkdir -p "android/app/src/main/res/$dir"
            magick logo-app.png -resize "${size}x${size}!" "android/app/src/main/res/$dir/ic_launcher.png"
            magick logo-app.png -resize "${size}x${size}!" "android/app/src/main/res/$dir/ic_launcher_round.png"
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set Android version
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")
          s = p.read_text()

          s = re.sub(
              r'versionCode\s+\d+',
              'versionCode 10',
              s,
              count=1
          )

          s = re.sub(
              r'versionName\s+["\'][^"\']+["\']',
              'versionName "10.0.0"',
              s,
              count=1
          )

          p.write_text(s)
          PY

          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kifnet-v10-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/kifnet-release.jks"

      - name: Configure release signing
        if: env.HAS_RELEASE_SIGNING == 'true'
        working-directory: android
        env:
          KIFNET_KEYSTORE_PATH: ${{ runner.temp }}/kifnet-release.jks
          KIFNET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KIFNET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KIFNET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 ../scripts/configure-android-signing.py

      - name: Build signed Release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload signed Release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kifnet-v10-android-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
