name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Verify web build
        run: test -f dist/index.html

      - name: Add Capacitor Android
        run: npx cap add android

      - name: Generate Android icons
        run: npx capacitor-assets generate --iconPath logo-app.png

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set Android version
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          import re
          s=re.sub(r'versionCode\s+\d+', 'versionCode 9', s, count=1)
          s=re.sub(r'versionName\s+["\'][^"\']+["\']', 'versionName "9.0.0"', s, count=1)
          p.write_text(s)
          PY
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kifnet-v9-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/kifnet-release.jks"

      - name: Configure release signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          KIFNET_KEYSTORE_PATH: ${{ runner.temp }}/kifnet-release.jks
          KIFNET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KIFNET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KIFNET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 ../scripts/configure-android-signing.py

      - name: Build signed Release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload signed Release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: kifnet-v9-android-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
